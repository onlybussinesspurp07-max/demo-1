<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Nunito:wght@800;900&display=swap"
        rel="stylesheet">
    <title>SY AIML Feedback Form</title>
    <link rel="stylesheet" href="/static/css/select_teacher.css" />
</head>

<body>
    <div class="header-left">
    </div>

    <div class="container">
        <label for="teacherSelect">Select Staff Name:</label>
        <select id="teacherSelect" class="dynamicTeacher">
            <option value="" selected disabled hidden>-- Select Teacher --</option>

        </select>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary" id="continueBtn"><a>Continue</a></button>
            <button type="button" class="btn btn-sec" id="reset-test">Reset</button>
            <button class="btn btn-ter"><a id="backBtn">Back</a></button>
            <button type="button" class="btn btn-sec" id="submitAll">Submit All</button>
        </div>

        <div id="output"></div>
    </div>

    <script src="/static/js/select_teacher.js">
    </script>
</body>

</html>
